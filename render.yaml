# ==============================================================================
# Render Blueprint — Craftify Django 5 + Managed PostgreSQL Production Deploy
# ==============================================================================
# Deploy directly from GitHub in Render Dashboard -> Blueprints -> New Blueprint Instance.
# After Render deploys, copy the generated service URL (e.g. https://craftify-api.onrender.com)
# into `vercel.json` and Razorpay Dashboard -> Developers -> Webhooks.

databases:
  - name: craftify-db
    plan: free
    databaseName: craftify
    user: craftify_user

services:
  - type: web
    name: craftify-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60"
    healthCheckPath: "/api/v1/health/"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DJANGO_SETTINGS_MODULE
        value: "config.settings.prod"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: craftify-db
          property: connectionString
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: AUTH_REFRESH_COOKIE_SAMESITE
        value: "Lax"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: EMAIL_HOST
        value: "smtp.gmail.com"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: "Craftify <noreply@craftify.in>"
